<!doctype html><meta charset="utf-8"><title>still</title>
<!-- tools/cef-page: a page at rest. Red in its top right corner, blue in its bottom right and green in the middle, to show
     the frame arrives the right way up with its colours in place. -->
<style>html,body{margin:0;height:100%;background:#f4f1ee;font:28px/1.4 sans-serif;color:#1f2328}
div{position:fixed;width:300px;height:160px;display:grid;place-items:center;color:#fff}
#r{right:0;top:0;background:#ff0000} #g{left:50%;top:50%;margin:-80px 0 0 -150px;background:#00a000} #b{right:0;bottom:0;background:#0000ff}
p{position:fixed;left:340px;top:30px;margin:0}</style>
<div id="r">red, top right</div><div id="g">green, middle</div><div id="b">blue, bottom right</div>
<p>A page at rest: once loaded, nothing here changes.</p>
