<!doctype html><meta charset="utf-8"><title>app</title>
<style>html,body{margin:0;height:100%;background:#f6f8fc;font:14px "Google Sans",Roboto,system-ui,sans-serif;color:#1f1f1f}
header{position:fixed;inset:0 0 auto 0;height:64px;backdrop-filter:blur(18px);background:#ffffffb0;box-shadow:0 1px 6px #0003;z-index:2}
#c{position:fixed;inset:64px 0 0 260px;overflow-y:auto;padding:8px 16px}
nav{position:fixed;inset:64px auto 0 0;width:250px;background:linear-gradient(#eaf1fb,#f6f8fc)}
.row{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;margin:4px 0;background:#fff;border-radius:14px;box-shadow:0 1px 2px #3c40434d,0 2px 8px 2px #3c404326}
.row:nth-child(3n){background:linear-gradient(90deg,#fff,#e8f0fe)}.dot{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px #fff,0 0 12px #1a73e855}
.s{font-weight:600;width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p{flex:1;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{padding:2px 10px;border-radius:12px;background:#d3e3fd;filter:drop-shadow(0 1px 2px #0003)}
svg{width:20px;height:20px;opacity:.7}</style>
<header></header><nav></nav><div id="c"></div>
<script>
const w = "Invoice for October project update meeting notes your order has shipped security alert new sign-in weekly digest".split(" "); let h = "";
for (let i = 0; i < 700; i++) h += `<div class="row"><svg viewBox="0 0 24 24"><path d="M12 17.3l6.2 3.7-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7 2 9.3l5.4 4.7-1.6 7z" fill="#5f6368"/></svg><div class="dot" style="background:hsl(${i*41%360} 60% 55%)"></div><div class="s">Sender ${i}</div><div class="p">${Array.from({length: 12}, (_, k) => w[(i * 5 + k) % w.length]).join(" ")}</div>${i % 3 ? "" : `<span class="chip">Label ${i % 7}</span>`}</div>`;
document.getElementById("c").innerHTML = h;
</script>
